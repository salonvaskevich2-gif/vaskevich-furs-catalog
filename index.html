<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f2">
  <meta name="description" content="Каталог свадебных шубок, накидок и пончо VASKEVICH">
  <title>Свадебные шубки — VASKEVICH</title>
  <style>
    :root{--ink:#171512;--muted:#77716b;--line:#e7e1db;--paper:#fff;--soft:#f7f5f2;--accent:#9d7a52}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    button{font:inherit}.hero{min-height:42vh;display:grid;place-items:center;padding:40px 20px 32px;background:linear-gradient(180deg,#fbfaf8 0,#fff 100%);text-align:center}
    .hero-inner{max-width:680px}.logo{width:min(260px,62vw);display:block;margin:0 auto 22px}.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,6vw,54px);font-weight:400;letter-spacing:.04em;margin:13px 0 8px}.lead{color:var(--muted);font-size:15px;line-height:1.6;margin:0}
    .catalog{max-width:1180px;margin:0 auto;padding:0 14px 80px}.toolbar{position:sticky;top:0;z-index:20;margin:0 -14px;padding:12px 14px 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(231,225,219,.85)}
    .toolbar-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.toolbar-row::-webkit-scrollbar{display:none}.toolbar-row+.toolbar-row{margin-top:8px}
    .filter{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer}.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}.filter.material{border-color:#ccb89f}.filter.material.active{background:var(--accent);border-color:var(--accent)}
    .status{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 12px;color:var(--muted);font-size:13px}.reset{border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 12px}.card{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer;overflow:hidden}.photo{display:block;position:relative;overflow:hidden;background:var(--soft);aspect-ratio:2/3}.photo img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .45s ease}.card:hover .photo img{transform:scale(1.018)}
    .number{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 2px 16px;background:#fff;font-size:13px;letter-spacing:.11em}.arrow{font-size:16px;color:var(--muted)}.empty{display:none;text-align:center;padding:60px 16px;color:var(--muted)}
    .product-modal,.viewer{position:fixed;inset:0;z-index:100;background:rgba(20,18,16,.72);display:none}.product-modal.open,.viewer.open{display:block}.sheet{position:absolute;inset:4vh max(16px,calc((100vw - 1040px)/2));background:#fff;overflow:auto;border-radius:3px;padding:52px 18px 24px}.close{position:absolute;right:14px;top:12px;border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:50%;font-size:25px;line-height:1;cursor:pointer;z-index:2}.sheet h2{text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:400;letter-spacing:.08em;margin:0 0 22px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:820px;margin:auto}.view{border:0;background:var(--soft);padding:0;cursor:zoom-in;position:relative}.view img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}.view span{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.88);padding:7px 10px;border-radius:999px;font-size:12px}.sheet-note{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 0}
    .viewer{background:rgba(0,0,0,.96);z-index:200;touch-action:none}.viewer .close{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}.stage{position:absolute;inset:0;overflow:hidden;touch-action:none}.stage img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;user-select:none;-webkit-user-drag:none}.viewer-label{position:absolute;left:14px;top:14px;color:#fff;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:999px;font-size:12px;z-index:3}.hint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:999px;font-size:12px;white-space:nowrap;z-index:3;transition:opacity .3s}
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:700px){.hero{min-height:34vh;padding-top:28px}.logo{width:min(210px,58vw)}.catalog{padding-left:10px;padding-right:10px}.toolbar{margin:0 -10px;padding-left:10px;padding-right:10px}.grid{gap:18px 8px}.number{font-size:12px}.sheet{inset:0;border-radius:0;padding:58px 10px 20px}.views{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px}.view{min-width:88%;scroll-snap-align:center}.sheet h2{font-size:24px}}
    @media(max-width:420px){.filter{font-size:12px;padding:8px 11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.photo img{transition:none}}
  </style>
</head>
<body>
  <header class="hero"><div class="hero-inner">
    <img class="logo" src="logo.webp" alt="VASKEVICH Bridal Salon">
    <div class="eyebrow">Свадебный салон</div>
    <h1>Шубки и накидки</h1>
    <p class="lead">Откройте модель, чтобы посмотреть оба ракурса и увеличить фотографию.</p>
  </div></header>
  <main class="catalog" id="catalog">
    <div class="toolbar" aria-label="Фильтры каталога">
      <div class="toolbar-row" id="typeFilters">
        <button class="filter active" data-type="all">Все модели</button>
        <button class="filter" data-type="jackets">Кофточки</button>
        <button class="filter" data-type="sleeveless">Без рукавов</button>
        <button class="filter" data-type="puffers">Пуховички</button>
        <button class="filter" data-type="scarves">Шарфики / пончо</button>
      </div>
      <div class="toolbar-row">
        <button class="filter material" id="naturalFilter" aria-pressed="false">Натуральный мех</button>
      </div>
    </div>
    <div class="status"><span id="count"></span><button class="reset" id="reset" hidden>Сбросить фильтры</button></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">В этой категории модели пока не отмечены.</div>
  </main>
  <div class="product-modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productTitle">
    <div class="sheet"><button class="close" id="closeProduct" aria-label="Закрыть">×</button><h2 id="productTitle"></h2><div class="views" id="views"></div><p class="sheet-note">Нажмите на фотографию для увеличения</p></div>
  </div>
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Увеличенная фотография">
    <div class="stage" id="stage"><img id="zoomImage" alt=""></div><div class="viewer-label" id="viewerLabel"></div><button class="close" id="closeViewer" aria-label="Закрыть">×</button><div class="hint" id="hint">Разведите два пальца для увеличения</div>
  </div>
  <script src="catalog.js?v=20260928-4"></script>
  <script>
  (()=>{
    const data=window.VASKEVICH_CATALOG.products;
    const grid=document.getElementById('grid'),count=document.getElementById('count'),empty=document.getElementById('empty'),reset=document.getElementById('reset');
    let type='all',natural=false;
    const assetVersion='20260928-4';
    const thumb=id=>`t${id}.webp?v=${assetVersion}`;
    const full=(id,view)=>`f${id}_${view}.webp?v=${assetVersion}`;
    grid.innerHTML=data.map(p=>`<button class="card" data-id="${p.id}" data-tags="${p.tags.join(' ')}" aria-label="Открыть модель ${p.id}"><span class="photo"><img src="${thumb(p.id)}" loading="lazy" decoding="async" alt="Свадебная шубка ${p.id}, вид спереди"></span><span class="number"><span>МОДЕЛЬ ${p.id}</span><span class="arrow">↗</span></span></button>`).join('');
    document.querySelectorAll('.card img').forEach(img=>img.addEventListener('error',()=>{const id=img.closest('.card').dataset.id;const fallbacks=[full(id,'front'),full(id,'three-quarter')];const next=Number(img.dataset.fallback||0);if(next<fallbacks.length){img.dataset.fallback=String(next+1);img.src=fallbacks[next]}else{img.closest('.photo').textContent='Фото временно недоступно'}}));
    function apply(){let shown=0;document.querySelectorAll('.card').forEach(card=>{const tags=card.dataset.tags.split(' ');const okType=type==='all'||tags.includes(type);const okNatural=!natural||tags.includes('natural');const show=okType&&okNatural;card.hidden=!show;if(show)shown++});count.textContent=`Показано: ${shown} из ${data.length}`;empty.style.display=shown?'none':'block';reset.hidden=type==='all'&&!natural}
    document.getElementById('typeFilters').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));apply()});
    const naturalBtn=document.getElementById('naturalFilter');naturalBtn.onclick=()=>{natural=!natural;naturalBtn.classList.toggle('active',natural);naturalBtn.setAttribute('aria-pressed',String(natural));apply()};
    reset.onclick=()=>{type='all';natural=false;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type==='all'));naturalBtn.classList.remove('active');naturalBtn.setAttribute('aria-pressed','false');apply()};
    const modal=document.getElementById('productModal'),title=document.getElementById('productTitle'),views=document.getElementById('views');
    function openProduct(id){title.textContent=`МОДЕЛЬ ${id}`;views.innerHTML=[["front","Фас"],["three-quarter","Ракурс ¾"]].map(([v,l])=>`<button class="view" data-src="${full(id,v)}" data-label="Модель ${id} · ${l}"><img src="${full(id,v)}" loading="eager" alt="Модель ${id}, ${l}"><span>${l}</span></button>`).join('');views.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>img.closest('.view').remove()));modal.classList.add('open');document.body.style.overflow='hidden'}
    function closeProduct(){modal.classList.remove('open');document.body.style.overflow=''}
    grid.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openProduct(c.dataset.id)});document.getElementById('closeProduct').onclick=closeProduct;modal.addEventListener('click',e=>{if(e.target===modal)closeProduct()});
    const viewer=document.getElementById('viewer'),stage=document.getElementById('stage'),zoom=document.getElementById('zoomImage'),label=document.getElementById('viewerLabel'),hint=document.getElementById('hint');let scale=1,x=0,y=0,startX=0,startY=0,baseX=0,baseY=0,startDistance=0,startScale=1,lastTap=0;
    const render=()=>zoom.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`;
    function fit(){const f=Math.min(stage.clientWidth/zoom.naturalWidth,stage.clientHeight/zoom.naturalHeight);zoom.style.width=`${zoom.naturalWidth*f}px`;zoom.style.height=`${zoom.naturalHeight*f}px`;scale=1;x=0;y=0;render()}
    function openViewer(src,text){zoom.onload=fit;zoom.src=src;label.textContent=text;hint.style.opacity='1';viewer.classList.add('open')}
    function closeViewer(){viewer.classList.remove('open');zoom.src='';if(!modal.classList.contains('open'))document.body.style.overflow=''}
    views.addEventListener('click',e=>{const b=e.target.closest('.view');if(b)openViewer(b.dataset.src,b.dataset.label)});document.getElementById('closeViewer').onclick=closeViewer;
    const distance=(a,b)=>Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
    stage.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===1){const now=Date.now();if(now-lastTap<280){scale=scale>1.05?1:2.5;if(scale===1)x=y=0;render()}lastTap=now;startX=e.touches[0].clientX;startY=e.touches[0].clientY;baseX=x;baseY=y}else if(e.touches.length===2){startDistance=distance(e.touches[0],e.touches[1]);startScale=scale}},{passive:false});
    stage.addEventListener('touchmove',e=>{e.preventDefault();hint.style.opacity='0';if(e.touches.length===1&&scale>1){x=baseX+e.touches[0].clientX-startX;y=baseY+e.touches[0].clientY-startY;render()}else if(e.touches.length===2){scale=Math.max(1,Math.min(6,startScale*distance(e.touches[0],e.touches[1])/startDistance));render()}},{passive:false});
    stage.addEventListener('wheel',e=>{e.preventDefault();hint.style.opacity='0';scale=Math.max(1,Math.min(6,scale*(e.deltaY<0?1.12:.9)));if(scale===1)x=y=0;render()},{passive:false});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(viewer.classList.contains('open'))closeViewer();else if(modal.classList.contains('open'))closeProduct()}});apply();
  })();
  </script>
</body>
</html>
